<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPE-SOUND - Aprende Guitarra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Tema antes de pintar (HU-F-323): preferencia guardada o la del sistema; sin destello. -->
    <script>
      try {
        var p = localStorage.getItem("sipe-tema");
        var claro =
          p === "claro" || (p !== "oscuro" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.tema = claro ? "claro" : "oscuro";
      } catch (e) {
        document.documentElement.dataset.tema = "oscuro";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
