<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPE-SOUND - Aprende Guitarra</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Tema antes de pintar (HU-F-323): preferencia guardada o la del sistema; sin destello. -->
    <script>
      try {
        var p = localStorage.getItem("sipe-tema");
        var claro =
          p === "claro" || (p !== "oscuro" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.tema = claro ? "claro" : "oscuro";
      } catch (e) {
        document.documentElement.dataset.tema = "oscuro";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
