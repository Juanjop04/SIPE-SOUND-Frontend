    <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ejercicios · S.I.P.E-Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0d0d0d; --surface:#161616; --surface2:#1e1e1e;
    --border:rgba(84, 7, 100, 0); --text:#f0ede8; --muted:#796285;
    --accent:#9849c6; --accent2:#78508f;
    --green:#4caf8e; --red:#e05c5c; --blue:#5c8ee0;
    --font-display:'Playfair Display',serif; --font-body:'DM Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;min-height:100vh;}

  /* NAV */
  nav{position:sticky;top:0;z-index:100;background:rgba(13,13,13,0.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
    padding:0 40px;height:60px;}
  .nav-logo{font-family:var(--font-display);font-size:1.2rem;color:var(--accent);}
  .nav-links{display:flex;gap:32px;list-style:none;}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:400;
    letter-spacing:0.06em;text-transform:uppercase;transition:color 0.2s;}
  .nav-links a.active{color:var(--accent);}
  .nav-links a:hover{color:var(--text);}

  /* LAYOUT */
  .page{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 60px);}

  /* SIDEBAR */
  .sidebar{border-right:1px solid var(--border);padding:28px 0;overflow-y:auto;}
  .sidebar-title{padding:0 24px 16px;font-size:0.7rem;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--muted);font-weight:500;}
  .ejercicio-item{padding:14px 24px;cursor:pointer;border-left:2px solid transparent;
    transition:all 0.2s;display:flex;flex-direction:column;gap:4px;}
  .ejercicio-item:hover{background:var(--surface);border-left-color:var(--border);}
  .ejercicio-item.active{background:var(--surface);border-left-color:var(--accent);}
  .ejercicio-item.done{opacity:0.6;}
  .ej-header{display:flex;align-items:center;justify-content:space-between;}
  .ej-nombre{font-size:0.9rem;font-weight:400;color:var(--text);}
  .ej-badge{font-size:0.65rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;
    padding:2px 8px;border-radius:10px;}
  .ej-badge.principiante{background:rgba(76,175,125,0.12);color:var(--green);}
  .ej-badge.intermedio{background:rgba(201,168,76,0.12);color:var(--accent);}
  .ej-badge.avanzado{background:rgba(224,92,92,0.12);color:var(--red);}
  .ej-meta{font-size:0.75rem;color:var(--muted);}
  .ej-mini-bar{height:2px;background:var(--surface2);border-radius:1px;margin-top:6px;}
  .ej-mini-fill{height:2px;background:var(--accent);border-radius:1px;transition:width 0.5s;}

  /* MAIN */
  .main{padding:36px 40px;display:flex;flex-direction:column;gap:28px;overflow-y:auto;}

  /* HEADER DEL EJERCICIO */
  .ej-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
  .ej-hero-text h1{font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.4rem);font-weight:400;line-height:1.2;}
  .ej-hero-text p{margin-top:8px;color:var(--muted);font-size:0.9rem;line-height:1.7;max-width:520px;}
  .ej-stats{display:flex;gap:20px;flex-shrink:0;}
  .stat-box{text-align:center;padding:14px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
  .stat-box .val{font-family:var(--font-display);font-size:1.6rem;color:var(--accent);}
  .stat-box .lbl{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:2px;}

  /* SECCIÓN */
  .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .section-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);
    font-weight:500;margin-bottom:16px;}

  /* TABLATURA */
  .tab-container{overflow-x:auto;padding-bottom:4px;}
  .tab-grid{display:flex;flex-direction:column;gap:0;font-family:monospace;font-size:0.95rem;
    white-space:nowrap;line-height:1;}
  .tab-row{display:flex;align-items:center;gap:8px;}
  .tab-string-name{width:22px;color:var(--accent);font-weight:700;font-size:0.9rem;flex-shrink:0;}
  .tab-line{color:var(--muted);letter-spacing:0.05em;line-height:2.2;}
  .tab-line span.beat{color:var(--text);}
  .tab-line span.active-beat{color:var(--accent2);font-weight:700;}

  /* METRÓNOMO */
  .metronome{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .bpm-display{font-family:var(--font-display);font-size:3.5rem;color:var(--accent);line-height:1;
    text-align:center;min-width:100px;}
  .bpm-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:-12px;}
  .bpm-slider{-webkit-appearance:none;appearance:none;width:100%;max-width:300px;height:3px;
    background:var(--surface2);border-radius:2px;outline:none;cursor:pointer;}
  .bpm-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
    border-radius:50%;background:var(--accent);cursor:pointer;transition:transform 0.1s;}
  .bpm-slider::-webkit-slider-thumb:hover{transform:scale(1.2);}
  .tempo-presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .preset-btn{padding:5px 14px;background:transparent;border:1px solid var(--border);
    border-radius:16px;color:var(--muted);font-family:var(--font-body);font-size:0.78rem;
    cursor:pointer;transition:all 0.2s;}
  .preset-btn:hover{border-color:var(--accent);color:var(--text);}
  .preset-btn.active-preset{background:var(--accent);border-color:var(--accent);color:var(--bg);}

  /* BEATS VISUALES */
  .beats-row{display:flex;gap:10px;justify-content:center;}
  .beat-dot{width:14px;height:14px;border-radius:50%;background:var(--surface2);
    border:1px solid var(--border);transition:all 0.08s;}
  .beat-dot.tick{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 12px rgba(201,168,76,0.6);transform:scale(1.25);}
  .beat-dot.accent{background:var(--accent2);border-color:var(--accent2);}

  /* BOTÓN PLAY */
  .play-btn{width:64px;height:64px;border-radius:50%;border:none;
    background:var(--accent);color:var(--bg);font-size:1.5rem;cursor:pointer;
    transition:background 0.2s,transform 0.1s;display:flex;align-items:center;justify-content:center;}
  .play-btn:hover{background:var(--accent2);}
  .play-btn:active{transform:scale(0.95);}
  .play-btn.playing{background:var(--red);}

  /* COMPÁS / TIEMPO */
  .metro-row{display:flex;align-items:center;gap:24px;justify-content:center;}
  .metro-ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .metro-ctrl label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .metro-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:6px 12px;border-radius:6px;font-family:var(--font-body);font-size:0.85rem;cursor:pointer;outline:none;}

  /* ACORDES */
  .acordes-row{display:flex;gap:16px;flex-wrap:wrap;}
  .acorde-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:16px;text-align:center;min-width:90px;cursor:pointer;transition:border-color 0.2s;}
  .acorde-card:hover{border-color:var(--accent);}
  .acorde-name{font-family:var(--font-display);font-size:1.3rem;color:var(--accent);margin-bottom:8px;}
  .acorde-svg{display:block;margin:0 auto;}

  /* PROGRESO DEL EJERCICIO */
  .progress-row{display:flex;align-items:center;gap:14px;}
  .progress-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;}
  .progress-fill{height:6px;background:var(--accent);border-radius:3px;transition:width 0.6s ease;}
  .progress-pct{font-family:var(--font-display);font-size:1rem;color:var(--accent);min-width:40px;text-align:right;}
  .btn-completar{padding:10px 24px;background:var(--green);color:#fff;border:none;
    border-radius:8px;font-family:var(--font-body);font-size:0.85rem;font-weight:500;
    cursor:pointer;transition:opacity 0.2s;}
  .btn-completar:hover{opacity:0.85;}

  /* INSTRUCCIONES */
  .steps-list{display:flex;flex-direction:column;gap:12px;}
  .step{display:flex;gap:14px;align-items:flex-start;}
  .step-num{width:26px;height:26px;border-radius:50%;background:rgba(201,168,76,0.12);
    color:var(--accent);font-size:0.78rem;font-weight:500;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;margin-top:1px;}
  .step-text{font-size:0.88rem;color:var(--muted);line-height:1.6;}

  /* RESPONSIVE */
  @media(max-width:750px){
    .page{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .main{padding:20px 16px;}
    nav{padding:0 16px;}
    .ej-hero{flex-direction:column;}
    .ej-stats{justify-content:flex-start;}
  }

  /* ANIMACIÓN */
  .main > *{animation:fadeUp 0.4s ease both;}
  .main > *:nth-child(1){animation-delay:0.05s;}
  .main > *:nth-child(2){animation-delay:0.1s;}
  .main > *:nth-child(3){animation-delay:0.15s;}
  .main > *:nth-child(4){animation-delay:0.2s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>

<script>
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
//  PROGRESO
// ═══════════════════════════════════════════
function getProgreso() { return JSON.parse(localStorage.getItem('progreso_ejercicios') || '{}'); }
function setProgreso(id, pct) {
  const p = getProgreso(); p[id] = pct;
  localStorage.setItem('progreso_ejercicios', JSON.stringify(p));
}

// ═══════════════════════════════════════════
//  METRÓNOMO (Web Audio API)
// ═══════════════════════════════════════════
let audioCtx = null;
let metroInterval = null;
let metroPlaying = false;
let metroBeat = 0;
let metroBPM = 60;
let metroBeats = 4;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playClick(acento) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = acento ? 1200 : 800;
  gain.gain.setValueAtTime(acento ? 0.5 : 0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.08);
}

function tickMetro() {
  playClick(metroBeat === 0);
  // Actualizar puntos visuales
  document.querySelectorAll('.beat-dot').forEach((d, i) => {
    d.classList.toggle('tick', i === metroBeat);
    d.classList.toggle('accent', i === metroBeat && metroBeat === 0);
  });
  metroBeat = (metroBeat + 1) % metroBeats;
}

function toggleMetro() {
  if (metroPlaying) {
    clearInterval(metroInterval);
    metroPlaying = false;
    metroBeat = 0;
    document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('tick','accent'));
  } else {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    metroPlaying = true;
    tickMetro();
    metroInterval = setInterval(tickMetro, (60 / metroBPM) * 1000);
  }
  const btn = document.getElementById('play-btn');
  if (btn) {
    btn.textContent = metroPlaying ? '⏹' : '▶';
    btn.classList.toggle('playing', metroPlaying);
  }
}

function setBPM(val) {
  metroBPM = Math.max(40, Math.min(220, parseInt(val)));
  const disp = document.getElementById('bpm-display');
  const slider = document.getElementById('bpm-slider');
  if (disp) disp.textContent = metroBPM;
  if (slider) slider.value = metroBPM;
  if (metroPlaying) {
    clearInterval(metroInterval);
    metroBeat = 0;
    metroInterval = setInterval(tickMetro, (60 / metroBPM) * 1000);
  }
  // resaltar preset activo
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active-preset', parseInt(b.dataset.bpm) === metroBPM);
  });
}

function setCompas(val) {
  metroBeats = parseInt(val);
  metroBeat = 0;
  renderBeats();
}

function renderBeats() {
  const row = document.getElementById('beats-row');
  if (!row) return;
  row.innerHTML = '';
  for (let i = 0; i < metroBeats; i++) {
    const d = document.createElement('div');
    d.className = 'beat-dot';
    row.appendChild(d);
  }
}

// ═══════════════════════════════════════════
//  DIAGRAMA DE ACORDE SVG
// ═══════════════════════════════════════════
const acordeData = {
  Am: [[1,'x'],[2,0],[3,2],[4,2],[5,1],[6,0]],
  Em: [[1,0],[2,0],[3,0],[4,2],[5,2],[6,0]],
  C:  [[1,'x'],[2,3],[3,2],[4,0],[5,1],[6,0]],
  G:  [[1,3],[2,2],[3,0],[4,0],[5,0],[6,3]],
  F:  [[1,1],[2,1],[3,2],[4,3],[5,3],[6,1]],
  Bm: [[1,'x'],[2,2],[3,4],[4,4],[5,3],[6,2]],
};

function diagramaAcorde(nombre) {
  const datos = acordeData[nombre];
  if (!datos) return `<div style="font-size:0.8rem;color:var(--muted)">Sin diagrama</div>`;
  const w = 70, h = 80, sx = 8, sy = 14, gx = 10, gy = 12;
  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="acorde-svg">`;
  // trastes
  for (let f = 0; f <= 4; f++) {
    svg += `<line x1="${sx}" y1="${sy+f*gy}" x2="${sx+5*gx}" y2="${sy+f*gy}" stroke="var(--muted)" stroke-width="${f===0?2:0.8}" opacity="0.5"/>`;
  }
  // cuerdas
  for (let s = 0; s < 6; s++) {
    svg += `<line x1="${sx+s*gx}" y1="${sy}" x2="${sx+s*gx}" y2="${sy+4*gy}" stroke="var(--muted)" stroke-width="0.8" opacity="0.5"/>`;
  }
  // dedos
  datos.forEach(([cuerda, traste], i) => {
    const x = sx + (i) * gx;
    if (traste === 'x') {
      svg += `<text x="${x}" y="${sy-4}" text-anchor="middle" font-size="8" fill="var(--red)" font-family="sans-serif">×</text>`;
    } else if (traste === 0) {
      svg += `<circle cx="${x}" cy="${sy-5}" r="3.5" fill="none" stroke="var(--accent)" stroke-width="1.2"/>`;
    } else {
      const cy = sy + (traste - 0.5) * gy;
      svg += `<circle cx="${x}" cy="${cy}" r="4" fill="var(--accent)"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

// ═══════════════════════════════════════════
//  RENDER SIDEBAR
// ═══════════════════════════════════════════
function renderSidebar(activoId) {
  const progreso = getProgreso();
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';
  ejercicios.forEach(ej => {
    const pct = progreso[ej.id] || 0;
    const div = document.createElement('div');
    div.className = `ejercicio-item${ej.id === activoId ? ' active' : ''}${pct===100?' done':''}`;
    div.innerHTML = `
      <div class="ej-header">
        <span class="ej-nombre">${ej.nombre}</span>
        <span>${pct===100?'✅':''}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:2px;">
        <span class="ej-badge ${ej.nivel}">${ej.nivel}</span>
        <span class="ej-meta">⏱ ${ej.duracion}</span>
      </div>
      <div class="ej-mini-bar"><div class="ej-mini-fill" style="width:${pct}%"></div></div>
    `;
    div.onclick = () => cargarEjercicio(ej.id);
    list.appendChild(div);
  });
}

// ═══════════════════════════════════════════
//  RENDER EJERCICIO PRINCIPAL
// ═══════════════════════════════════════════
function cargarEjercicio(id) {
  // Detener metrónomo si estaba corriendo
  if (metroPlaying) toggleMetro();
  const ej = ejercicios.find(e => e.id === id);
  if (!ej) return;
  const progreso = getProgreso();
  const pct = progreso[id] || 0;
  metroBPM = ej.bpmRecomendado;
  metroBeats = parseInt(ej.compas.split('/')[0]);

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <!-- HERO -->
    <div class="ej-hero">
      <div class="ej-hero-text">
        <span class="ej-badge ${ej.nivel}" style="margin-bottom:10px;display:inline-block">${ej.nivel}</span>
        <h1>${ej.nombre}</h1>
        <p>${ej.descripcion}</p>
      </div>
      <div class="ej-stats">
        <div class="stat-box"><div class="val">${ej.bpmRecomendado}</div><div class="lbl">BPM</div></div>
        <div class="stat-box"><div class="val">${ej.duracion.replace(' min','')}</div><div class="lbl">minutos</div></div>
        <div class="stat-box"><div class="val">${ej.compas}</div><div class="lbl">Compás</div></div>
      </div>
    </div>

    <!-- TABLATURA -->
    <div class="section">
      <div class="section-title">Tablatura</div>
      <div class="tab-container">
        <div class="tab-grid">
          ${ej.tablatura.map(r => `
            <div class="tab-row">
              <span class="tab-string-name">${r.cuerda}</span>
              <span class="tab-line">${r.notas}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- ACORDES -->
    <div class="section">
      <div class="section-title">Acordes del ejercicio</div>
      <div class="acordes-row">
        ${ej.acordes.map(a => `
          <div class="acorde-card">
            <div class="acorde-name">${a}</div>
            ${diagramaAcorde(a)}
          </div>
        `).join('')}
      </div>
    </div>

    <!-- METRÓNOMO -->
    <div class="section">
      <div class="section-title">Metrónomo</div>
      <div class="metronome">
        <div>
          <div class="bpm-display" id="bpm-display">${metroBPM}</div>
          <div class="bpm-label">BPM</div>
        </div>
        <input type="range" class="bpm-slider" id="bpm-slider"
          min="40" max="220" value="${metroBPM}"
          oninput="setBPM(this.value)"/>
        <div class="tempo-presets">
          ${[50,60,70,80,100,120].map(b =>
            `<button class="preset-btn${b===metroBPM?' active-preset':''}" data-bpm="${b}" onclick="setBPM(${b})">${b}<br><span style="font-size:0.65rem;opacity:0.7">${b<=60?'Lento':b<=80?'Moderado':b<=100?'Normal':'Rápido'}</span></button>`
          ).join('')}
        </div>
        <div class="metro-row">
          <div class="metro-ctrl">
            <label>Compás</label>
            <select class="metro-select" onchange="setCompas(this.value)">
              <option value="4"${metroBeats===4?' selected':''}>4/4</option>
              <option value="3"${metroBeats===3?' selected':''}>3/4</option>
              <option value="6"${metroBeats===6?' selected':''}>6/8</option>
            </select>
          </div>
          <button class="play-btn" id="play-btn" onclick="toggleMetro()">▶</button>
        </div>
        <div class="beats-row" id="beats-row"></div>
      </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div class="section">
      <div class="section-title">Cómo practicar</div>
      <div class="steps-list">
        ${ej.pasos.map((p, i) => `
          <div class="step">
            <div class="step-num">${i+1}</div>
            <div class="step-text">${p}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- PROGRESO -->
    <div class="section">
      <div class="section-title">Tu progreso en este ejercicio</div>
      <div class="progress-row">
        <div class="progress-track">
          <div class="progress-fill" id="prog-fill" style="width:${pct}%"></div>
        </div>
        <div class="progress-pct" id="prog-pct">${pct}%</div>
        <button class="btn-completar" onclick="marcarProgreso(${id})">
          ${pct===100?'✅ Completado':'Marcar progreso +25%'}
        </button>
      </div>
    </div>
  `;

  renderBeats();
  renderSidebar(id);
}

function marcarProgreso(id) {
  const progreso = getProgreso();
  const actual = progreso[id] || 0;
  const nuevo = Math.min(actual + 25, 100);
  setProgreso(id, nuevo);
  document.getElementById('prog-fill').style.width = nuevo + '%';
  document.getElementById('prog-pct').textContent = nuevo + '%';
  if (nuevo === 100) {
    document.querySelector('.btn-completar').textContent = '✅ Completado';
  }
  renderSidebar(id);
}


cargarEjercicio(1);
</script>
